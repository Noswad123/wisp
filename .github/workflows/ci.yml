name: CI

on:
  push:
  pull_request:

jobs:
  shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n bin/wisp install.sh scripts/smoke-test completions/bash/wisp && zsh -n completions/zsh/_wisp
      - name: Smoke test
        run: scripts/smoke-test
